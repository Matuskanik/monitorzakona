<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Monitor zákona</title>
    <link rel="stylesheet" href="css/liquid-glass.css">
    <script>(function(){if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark-mode');})();</script>
    <style>.lg-logo{max-width:600px;width:auto;height:auto;flex-shrink:0;}.lg-header{display:flex;align-items:center;gap:28px;margin-bottom:28px;flex-wrap:wrap;}.lg-tagline{flex:1;min-width:200px;}</style>
</head>
<body>
    <div class="lg-dark-toggle" id="darkModeToggle" title="Tmavý režim">
        <div class="lg-dark-toggle-row">
            <span class="label-off">OFF</span>
            <div class="lg-dark-switch" id="darkModeSwitch" role="switch" aria-checked="false" aria-label="Tmavý režim"></div>
            <span class="label-on">ON</span>
        </div>
        <span class="lg-dark-label">Tmavý režim</span>
    </div>
    <div class="lg-container">
        <div class="lg-header">
            <img src="logo.png" alt="Monitor zákona" class="lg-logo">
            <p class="lg-tagline lg-tagline">Sledujeme nové zákony, legislatívne zmeny a oficiálne dokumenty vlády – prehľadne, na jednom mieste.</p>
        </div>
        
        <div class="lg-search-container">
            <form method="GET" action="" class="lg-search-box" id="searchForm">
                <input 
                    type="text" 
                    name="search" 
                    class="lg-search-input" 
                    id="searchInput"
                    placeholder="Hľadať zákony podľa názvu alebo tagov (napr. financie, školstvo, dane...)" 
                >
                <button type="submit" class="lg-btn lg-btn-primary">Hľadať</button>
            </form>
            <div class="lg-search-results-info" id="searchResultsInfo" style="display: none;"></div>
        </div>
        
        <div id="lawsContainer">
            <div class="lg-loading">Načítavam zákony...</div>
        </div>
        
        <div class="lg-footer">
            <p>Automaticky monitorované z <a href="https://www.nrsr.sk/web/default.aspx?SectionId=184" target="_blank">NR SR</a></p>
            <p style="margin-top: 10px;">
                <a href="prompts.html">Použité prompty</a> | Autor: Matúš Kaník
            </p>
        </div>
    </div>

    <script>
        // Fixed tag color mapping - consistent colors for each tag (same as law.html)
        const tagColors = {
            'financie': '#e74c3c',
            'školstvo': '#3498db',
            'zdravotníctvo': '#2ecc71',
            'dane': '#f39c12',
            'práca': '#9b59b6',
            'bydlenie': '#1abc9c',
            'doprava': '#34495e',
            'životné prostredie': '#16a085',
            'sociálne zabezpečenie': '#e67e22',
            'občianske práva': '#c0392b',
            'justícia': '#8e44ad',
            'sociálna politika': '#e67e22',
            'ekonomika': '#e74c3c',
            'šport': '#1abc9c',
            'kultúra': '#9b59b6',
            'energetika': '#f39c12',
            'obrana': '#c0392b',
            'verejná správa': '#7f8c8d',
            'medicína': '#2ecc71',
            'vzdelávanie': '#3498db'
        };

        function getTagColor(tag) {
            const tagLower = tag.toLowerCase().trim();
            // Try exact match first
            if (tagColors[tagLower]) {
                return tagColors[tagLower];
            }
            // Try partial match
            for (const [key, color] of Object.entries(tagColors)) {
                if (tagLower.includes(key) || key.includes(tagLower)) {
                    return color;
                }
            }
            // Default color for unknown tags
            return '#95a5a6';
        }

        function formatDate(dateString) {
            if (!dateString) return 'dátum nie je dostupný';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('sk-SK', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch (e) {
                return dateString;
            }
        }

        function renderLaws(laws, searchQuery = '') {
            const container = document.getElementById('lawsContainer');
            const searchInfo = document.getElementById('searchResultsInfo');
            
            if (laws.length === 0) {
                container.innerHTML = `
                    <div class="lg-empty">
                        ${searchQuery 
                            ? `<p>Pre vyhľadávanie "${escapeHtml(searchQuery)}" neboli nájdené žiadne zákony.</p>
                               <p style="margin-top: 10px; font-size: 0.9em;">
                                   <a href="index.html" class="lg-link">Zobraziť všetky zákony</a>
                               </p>`
                            : '<p>Zatiaľ neboli spracované žiadne zákony.</p>'
                        }
                    </div>
                `;
                return;
            }

            let html = '';
            laws.forEach(law => {
                const tags = law.tags || [];
                let tagsHtml = '';
                if (tags.length > 0) {
                    tagsHtml = '<div class="lg-law-tags">';
                    tags.forEach(tag => {
                        const color = getTagColor(tag);
                        tagsHtml += `<span class="lg-law-tag" style="background-color: ${color};">${escapeHtml(tag)}</span>`;
                    });
                    tagsHtml += '</div>';
                }

                const approvalDate = law.approval_date || '';
                const createdDate = formatDate(law.created_at);

                html += `
                    <div class="lg-law-item">
                        ${tagsHtml}
                        <div class="lg-law-title">
                            <a href="law.html?master_id=${encodeURIComponent(law.master_id)}">
                                ${escapeHtml(law.title)}
                            </a>
                        </div>
                        <div class="lg-law-date">
                            ${approvalDate ? `<span class="law-date-label">Zverejnené:</span> ${escapeHtml(approvalDate)}` : '<span class="law-date-label">Zverejnené:</span> dátum nie je dostupný'}
                            ${createdDate ? `| <span class="law-date-label">Spracované:</span> ${createdDate}` : ''}
                        </div>
                        <div class="lg-law-source">
                            <a href="${escapeHtml(law.source_url)}" target="_blank">
                                Zdroj: NR SR →
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            if (searchQuery) {
                const count = laws.length;
                const suffix = count === 1 ? '' : (count >= 2 && count <= 4 ? 'y' : 'ov');
                searchInfo.innerHTML = `
                    Nájdených: ${count} zákon${suffix} pre "${escapeHtml(searchQuery)}"
                    <a href="index.html" class="lg-link" style="margin-left: 10px;">Zrušiť vyhľadávanie</a>
                `;
                searchInfo.style.display = 'block';
            } else {
                searchInfo.style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterLaws(laws, searchQuery) {
            if (!searchQuery) return laws;
            
            const searchLower = searchQuery.toLowerCase();
            return laws.filter(law => {
                const titleLower = law.title.toLowerCase();
                if (titleLower.includes(searchLower)) return true;
                
                const tags = law.tags || [];
                return tags.some(tag => tag.toLowerCase().includes(searchLower));
            });
        }

        // Load laws from JSON
        async function loadLaws() {
            try {
                // Try multiple paths for Cloudflare Pages compatibility
                let response = null;
                const paths = [
                    '/data/index.json',
                    'data/index.json',
                    './data/index.json'
                ];
                
                // Add cache-busting to prevent Cloudflare Pages cache issues
                const cacheBuster = '?v=' + Date.now();
                let lastError = null;
                for (const path of paths) {
                    try {
                        response = await fetch(path + cacheBuster, {
                            cache: 'no-cache',
                            headers: {
                                'Cache-Control': 'no-cache'
                            }
                        });
                        if (response.ok) {
                            break;
                        }
                    } catch (e) {
                        lastError = e;
                        console.warn(`Failed to fetch from ${path}:`, e);
                    }
                }
                
                // Try without cache buster if first attempt failed
                if (!response || !response.ok) {
                    for (const path of paths) {
                        try {
                            response = await fetch(path, {
                                cache: 'no-cache',
                                headers: {
                                    'Cache-Control': 'no-cache'
                                }
                            });
                            if (response.ok) {
                                break;
                            }
                        } catch (e) {
                            lastError = e;
                        }
                    }
                }
                
                if (!response || !response.ok) {
                    const errorMsg = lastError ? lastError.message : (response ? response.status + ' ' + response.statusText : 'No response');
                    throw new Error('Failed to load laws: ' + errorMsg);
                }
                
                const laws = await response.json();
                
                // Validate that we got valid data
                if (!Array.isArray(laws)) {
                    throw new Error('Invalid laws data structure - expected array');
                }
                
                // Get search query from URL
                const urlParams = new URLSearchParams(window.location.search);
                const searchQuery = urlParams.get('search') || '';
                
                // Set search input value
                document.getElementById('searchInput').value = searchQuery;
                
                // Filter and render
                const filteredLaws = filterLaws(laws, searchQuery);
                renderLaws(filteredLaws, searchQuery);
            } catch (error) {
                console.error('Error loading laws:', error);
                document.getElementById('lawsContainer').innerHTML = `
                    <div class="lg-empty">
                        <p>Chyba pri načítavaní zákonov. Skúste obnoviť stránku.</p>
                    </div>
                `;
            }
        }

        // Handle search form submission
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const searchQuery = document.getElementById('searchInput').value.trim();
            const url = searchQuery ? `index.html?search=${encodeURIComponent(searchQuery)}` : 'index.html';
            window.location.href = url;
        });

        // Load laws on page load
        loadLaws();

        // Dark mode – uloženie do localStorage, prepínač zľava (OFF) doprava (ON)
        (function() {
            var KEY = 'darkMode';
            var el = document.documentElement;
            var sw = document.getElementById('darkModeSwitch');
            var tg = document.getElementById('darkModeToggle');
            function isOn() { return localStorage.getItem(KEY) === '1'; }
            function apply(on) {
                if (on) { el.classList.add('dark-mode'); if (sw) { sw.classList.add('on'); sw.setAttribute('aria-checked', 'true'); } }
                else { el.classList.remove('dark-mode'); if (sw) { sw.classList.remove('on'); sw.setAttribute('aria-checked', 'false'); } }
            }
            function toggle() {
                var on = !isOn();
                localStorage.setItem(KEY, on ? '1' : '0');
                apply(on);
            }
            apply(isOn());
            if (sw) sw.addEventListener('click', toggle);
            if (tg) tg.addEventListener('click', function(e) { if (e.target !== sw) toggle(); });
        })();
    </script>
</body>
</html>
